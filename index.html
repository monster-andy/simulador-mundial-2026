<!DOCTYPE html>
<!-- SIMULADOR MUNDIAL 2026 · v2.8.0 · by MonsterAndy -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Simulador Mundial 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0e1a; --surface:#111827; --surface2:#1a2235;
  --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.15);
  --text:#f0f4ff; --muted:#7a8aaa; --accent:#e8c840; --accent2:#ff6b35;
  --green:#22c55e; --blue:#3b82f6; --red:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;
  background-image:radial-gradient(ellipse at 20% 0%,rgba(59,130,246,.08) 0%,transparent 60%),
                   radial-gradient(ellipse at 80% 100%,rgba(232,200,64,.06) 0%,transparent 60%);}

/* HEADER */
header{
  padding:.75rem 1.25rem; border-bottom:1px solid var(--border);
  display:grid; grid-template-columns:auto 1fr auto;
  align-items:center; gap:10px;
  position:sticky;top:0;z-index:100;
  background:rgba(10,14,26,.96); backdrop-filter:blur(12px);
}
.logo{font-family:'Bebas Neue',sans-serif;white-space:nowrap;display:inline-flex;flex-direction:row;align-items:center;gap:5px;}
.logo-left{display:flex;flex-direction:column;justify-content:center;gap:0;}
/* line2 = MUNDIAL / WORLD CUP: reference, 18px. Both langs normalised to same px width via JS */
.logo-line2{font-size:18px;color:var(--text);display:block;line-height:1.1;letter-spacing:5px;}
/* line1 = SIMULADOR / SIMULATOR: smaller, stretches to match line2 width via JS */
.logo-line1{font-size:11px;color:rgba(255,255,255,.6);display:block;line-height:1.25;letter-spacing:3px;}
/* line3 = 2026: exactly 2× line2 = 36px, fills full height of left column */
.logo-line3{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--accent);line-height:1;display:flex;align-items:center;letter-spacing:-0.5px;}
.logo-credit{font-size:8px;color:rgba(255,255,255,.2);letter-spacing:1px;margin-top:1px;display:block;font-family:'DM Sans',sans-serif;}
.header-right{display:flex;align-items:center;gap:10px;justify-content:flex-end;}
.api-indicator{font-size:11px;color:var(--green);display:flex;align-items:center;gap:5px;white-space:nowrap;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* NAV */
.nav-tabs{display:flex;gap:3px;background:var(--surface);border-radius:8px;padding:3px;overflow-x:auto;scrollbar-width:none;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{padding:6px 12px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;border:none;
  background:transparent;color:var(--muted);transition:all .2s;white-space:nowrap;font-family:'DM Sans',sans-serif;}
.nav-tab.active{background:var(--accent);color:#0a0e1a;}
.nav-tab:hover:not(.active){color:var(--text);}

/* LANG TOGGLE */
.lang-btn{background:var(--surface2);border:1px solid var(--border2);color:var(--muted);
  border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;
  transition:all .2s;white-space:nowrap;}
.lang-btn:hover{color:var(--text);border-color:var(--accent);}

/* MAIN */
main{max-width:1200px;margin:0 auto;padding:1.25rem;}

/* SECTION */
.section{display:none;} .section.active{display:block;}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;margin-bottom:.15rem;}
.section-sub{font-size:13px;color:var(--muted);margin-bottom:1.25rem;}

/* ACTION BAR */
.action-bar{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:12px 16px;margin-bottom:1.25rem;
  display:flex;align-items:flex-start;gap:10px;
}
.action-bar-left{display:flex;flex-direction:column;gap:6px;}
.action-bar-text{font-size:12px;color:var(--muted);margin-bottom:2px;}
.action-bar-text strong{color:var(--text);}
.action-btns{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;}
/* Wraps only the primary sim button + its progress bar */
.sim-primary-wrap{display:flex;flex-direction:column;gap:4px;}
.progress-wrap{height:3px;background:var(--border);border-radius:2px;overflow:hidden;width:100%;}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s;}

/* BUTTONS */
.btn-primary{padding:8px 18px;background:var(--accent);color:#0a0e1a;border:none;border-radius:7px;
  font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px;cursor:pointer;transition:opacity .2s;white-space:nowrap;}
.btn-primary:hover{opacity:.85;} .btn-primary:disabled{opacity:.35;cursor:not-allowed;}
.btn-row-inline{display:flex;align-items:center;gap:6px;}
.btn-icon-reset{width:32px;height:32px;padding:0;background:transparent;color:var(--muted);
  border:none;border-radius:7px;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.btn-icon-reset:hover{background:rgba(239,68,68,.12);color:var(--red);}
.btn-ghost{padding:8px 16px;background:transparent;color:var(--muted);border:1px solid var(--border2);
  border-radius:7px;font-size:13px;cursor:pointer;transition:all .2s;white-space:nowrap;font-family:'DM Sans',sans-serif;}
.btn-ghost:hover{color:var(--text);border-color:var(--border2);}

/* GROUPS GRID */
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
.group-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.group-card:hover{border-color:var(--border2);}
.group-header{background:var(--surface2);padding:10px 14px;border-bottom:1px solid var(--border);}
.group-header-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
.group-letter{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--accent);line-height:1;}
.group-name{font-size:11px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.group-flags-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.group-flag-chip{display:flex;flex-direction:column;align-items:center;gap:1px;}
.group-flag-chip .gf{font-size:20px;line-height:1;}
.group-flag-chip .gi{font-size:9px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
.group-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.btn-group-action{padding:4px 10px;border-radius:5px;font-size:11px;cursor:pointer;border:1px solid var(--border2);
  background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;transition:all .2s;}
.btn-group-action:hover{color:var(--accent);border-color:var(--accent);}
.btn-group-reset{width:26px;height:26px;padding:0;border-radius:5px;font-size:13px;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);border-color:transparent;}
.btn-group-reset:hover{color:var(--red)!important;border-color:transparent!important;background:rgba(239,68,68,.1)!important;}

/* FOOTER */
.site-footer{text-align:center;padding:1.5rem;font-size:11px;color:rgba(255,255,255,.2);letter-spacing:.5px;}

/* STANDINGS */
.group-standings{padding:6px 14px;border-bottom:1px solid var(--border);}
.standings-row{display:grid;grid-template-columns:14px 1fr 22px 22px 26px;gap:4px;
  align-items:center;padding:4px 0;font-size:12px;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.03);}
.standings-row:last-child{border-bottom:none;}
.standings-row.hdr{color:rgba(255,255,255,.25);font-size:10px;text-transform:uppercase;letter-spacing:.5px;}
.standings-row.qualified{color:var(--text);}
.pos{color:var(--muted);font-size:11px;}
.flag-name{display:flex;align-items:center;gap:5px;overflow:hidden;}
.s-flag{font-size:13px;} .s-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pts{font-weight:600;color:var(--text);text-align:right;}
.qbar{width:3px;height:13px;border-radius:2px;background:var(--accent);margin-right:3px;flex-shrink:0;}
.ebar{width:3px;height:13px;border-radius:2px;background:transparent;margin-right:3px;flex-shrink:0;}

/* MATCHES */
.matches-list{padding:10px 14px;}
.match-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-bottom:7px;}
.match-item:last-child{margin-bottom:0;}
.match-row{display:flex;align-items:center;gap:6px;}
.match-team{flex:1;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;}
.match-team.away{flex-direction:row-reverse;text-align:right;}
.m-flag{font-size:15px;line-height:1;}
.match-score{display:flex;align-items:center;gap:3px;min-width:50px;justify-content:center;}
.score-digit{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--text);width:20px;text-align:center;line-height:1;}
.score-sep{color:var(--muted);font-size:13px;}
.match-date{font-size:10px;color:var(--muted);margin-top:3px;text-align:center;}

/* RESULT INFO */
.result-info{margin-top:7px;padding:7px 9px;background:rgba(255,255,255,.03);border-radius:5px;font-size:12px;display:none;}
.result-info.show{display:block;}
.result-winner{color:var(--green);font-weight:500;margin-bottom:3px;}
.result-comment{color:var(--muted);line-height:1.4;}
.result-probs{display:flex;gap:6px;margin-top:5px;}
.prob-bar-wrap{flex:1;}
.prob-label{font-size:9px;color:var(--muted);margin-bottom:2px;text-align:center;}
.prob-bar{height:3px;border-radius:2px;background:var(--border2);overflow:hidden;}
.prob-fill{height:100%;border-radius:2px;transition:width .4s;}
.prob-fill.home{background:var(--blue);} .prob-fill.draw{background:var(--muted);} .prob-fill.away{background:var(--accent2);}
.prob-pct{font-size:9px;text-align:center;margin-top:2px;color:var(--muted);}

/* SIM BUTTON */
.btn-sim{width:100%;margin-top:7px;padding:6px;background:transparent;border:1px solid var(--border2);
  border-radius:5px;color:var(--muted);font-size:11px;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:5px;font-family:'DM Sans',sans-serif;}
.btn-sim:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.btn-sim:disabled{opacity:.4;cursor:not-allowed;}
.btn-sim.done{border-color:var(--blue);color:var(--blue);}
.spinner-sm{width:11px;height:11px;border:1.5px solid var(--border2);border-top-color:var(--accent);
  border-radius:50%;animation:spin .6s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg)}}

/* BRACKET */
.bracket-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.bracket-match{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.bracket-match.pending{opacity:.45;}
.bm-label{font-size:10px;color:var(--muted);padding:6px 10px 0;text-transform:uppercase;letter-spacing:.5px;}
.bracket-team{display:flex;align-items:center;gap:8px;padding:9px 10px;font-size:13px;border-bottom:1px solid var(--border);border-left:3px solid transparent;}
.bracket-team:last-child{border-bottom:none;}
.bracket-team.winner{border-left-color:var(--accent);color:var(--accent);font-weight:600;}
.bracket-team.loser{color:var(--muted);}
.b-flag{font-size:17px;} .b-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.b-score{font-family:'Bebas Neue',sans-serif;font-size:17px;min-width:16px;text-align:right;}
.b-tbd{color:var(--muted);font-style:italic;font-size:12px;}
.bm-result{margin:0 10px 8px;padding:7px 9px;background:rgba(255,255,255,.03);border-radius:5px;font-size:12px;display:none;}
.bm-result.show{display:block;}
.bm-result-winner{color:var(--green);font-weight:500;margin-bottom:3px;}
.bm-result-comment{color:var(--muted);line-height:1.4;font-size:11px;}
.bm-result-probs{display:flex;gap:6px;margin-top:5px;}
.bm-prob-wrap{flex:1;}
.bm-prob-label{font-size:9px;color:var(--muted);margin-bottom:2px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bm-prob-bar{height:3px;border-radius:2px;background:var(--border2);overflow:hidden;}
.bm-prob-fill{height:100%;border-radius:2px;}
.bm-prob-fill.h{background:var(--blue);} .bm-prob-fill.a{background:var(--accent2);}
.bm-prob-pct{font-size:9px;text-align:center;margin-top:2px;color:var(--muted);}
.bm-sim-btn{width:100%;padding:7px;background:transparent;border:none;border-top:1px solid var(--border);
  color:var(--muted);font-size:12px;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;
  display:flex;align-items:center;justify-content:center;gap:5px;}
.bm-sim-btn:hover:not(:disabled){background:rgba(232,200,64,.05);color:var(--accent);}
.bm-sim-btn:disabled{opacity:.4;cursor:not-allowed;}
.bm-sim-btn.resim{color:var(--blue);}
.bm-sim-btn.resim:hover{color:var(--blue);background:rgba(59,130,246,.06);}
.bm-actions{display:flex;border-top:1px solid var(--border);}
.bm-actions .bm-sim-btn{border-top:none;border-right:1px solid var(--border);flex:1;}
.bm-actions .bm-sim-btn:last-child{border-right:none;}

/* CHAMPION */
.champion-display{text-align:center;padding:2.5rem 1rem;}
.champion-display .trophy-big{font-size:72px;display:block;margin-bottom:1rem;}
.champion-name{font-family:'Bebas Neue',sans-serif;font-size:52px;color:var(--accent);letter-spacing:4px;}
.champion-sub{font-size:15px;color:var(--muted);margin-top:.5rem;}

/* PENDING MESSAGE */
.pending-msg{text-align:center;padding:3rem 1rem;color:var(--muted);}
.pending-msg .big{font-size:44px;margin-bottom:.75rem;}
.pending-msg h3{font-size:17px;font-weight:500;color:var(--text);margin-bottom:.4rem;}
.pending-msg p{font-size:13px;line-height:1.6;margin-bottom:1.25rem;}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;z-index:999;background:var(--surface);
  border:1px solid var(--border2);border-radius:8px;padding:11px 15px;font-size:13px;color:var(--text);
  transform:translateY(80px);opacity:0;transition:all .3s;max-width:260px;}
.toast.show{transform:translateY(0);opacity:1;}

/* CONFIRM DIALOG */
.confirm-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);
  display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.confirm-overlay.show{display:flex;}
.confirm-box{background:var(--surface);border:1px solid var(--border2);border-radius:14px;
  padding:2rem;max-width:340px;width:90%;text-align:center;}
.confirm-box h3{font-size:17px;font-weight:500;margin-bottom:.5rem;}
.confirm-box p{font-size:13px;color:var(--muted);margin-bottom:1.5rem;line-height:1.5;}
.confirm-btns{display:flex;gap:10px;justify-content:center;}
.confirm-btns .btn-ghost{flex:1;text-align:center;}
.btn-confirm-ok{flex:1;text-align:center;padding:8px 16px;background:transparent;
  color:var(--red);border:1px solid var(--red);border-radius:7px;font-size:13px;
  cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;}
.btn-primary.has-pending{background:#d97706;animation:pulse-btn 1.5s ease-in-out infinite;}
@keyframes pulse-btn{0%,100%{opacity:1}50%{opacity:.75}}

@media(max-width:640px){
  header{grid-template-columns:1fr auto;grid-template-rows:auto auto;}
  .logo-line1{font-size:8px;} .logo-line2{font-size:11px;} .logo-line3{font-size:22px;}
  .nav-tabs{grid-column:1/-1;order:3;}
  .header-right{order:2;}
  main{padding:.75rem;}
  .groups-grid{grid-template-columns:1fr;}
  .bracket-grid{grid-template-columns:1fr;}
  .action-btns{width:100%;}
  .btn-primary{flex:1;text-align:center;}
  .section-title{font-size:22px;}
  .champion-name{font-size:36px;}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-left">
      <span class="logo-line1" id="logo-line1">SIMULADOR</span>
      <span class="logo-line2" id="logo-line2">MUNDIAL</span>
      <span class="logo-credit">by MonsterAndy</span>
    </div>
    <span class="logo-line3" id="logo-line3">2026</span>
  </div>
  <div class="header-right">
    <div class="api-indicator"><span class="dot"></span> <span data-t="active"></span></div>
    <button class="lang-btn" onclick="toggleLang()">🌐 <span id="lang-label">EN</span></button>
  </div>
  <nav class="nav-tabs" id="nav-tabs">
    <button class="nav-tab active" onclick="showSection('grupos',this)" data-t="nav_groups"></button>
    <button class="nav-tab" onclick="showSection('r16',this)" data-t="nav_r16"></button>
    <button class="nav-tab" onclick="showSection('r8',this)" data-t="nav_r8"></button>
    <button class="nav-tab" onclick="showSection('r4',this)" data-t="nav_r4"></button>
    <button class="nav-tab" onclick="showSection('r2',this)" data-t="nav_r2"></button>
    <button class="nav-tab" onclick="showSection('r1',this)" data-t="nav_r1"></button>
  </nav>
</header>

<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <h3 id="confirm-title"></h3>
    <p id="confirm-msg"></p>
    <div class="confirm-btns">
      <button class="btn-ghost" onclick="closeConfirm()"><span data-t="cancel"></span></button>
      <button class="btn-confirm-ok" id="confirm-ok"><span data-t="confirm_yes"></span></button>
    </div>
  </div>
</div>

<main>
<!-- GROUPS -->
<div class="section active" id="section-grupos">
  <div class="section-title" data-t="groups_title"></div>
  <div class="section-sub" data-t="groups_sub"></div>
  <div class="action-bar">
    <div class="action-bar-left">
      <div class="action-btns">
        <div class="sim-primary-wrap">
          <button class="btn-primary" onclick="simAllGroups()" id="btn-sim-all-groups" data-t="btn_sim_all"></button>
          <div class="progress-wrap"><div class="progress-fill" id="progress-fill-grupos" style="width:0%"></div></div>
        </div>
        <button class="btn-icon-reset" onclick="askReset('groups')" title="Reset">🗑</button>
      </div>
    </div>
  </div>
  <div class="groups-grid" id="groups-grid"></div>
</div>

<!-- KNOCKOUT SECTIONS -->
<div class="section" id="section-r16">
  <div class="section-title" data-t="r16_title"></div>
  <div class="section-sub" data-t="r16_sub"></div>
  <div class="action-bar">
    <div class="action-bar-left">
      <div class="action-bar-text" data-t="ko_action_desc"></div>
      <div class="action-btns">
        <div class="sim-primary-wrap">
          <button class="btn-primary" onclick="simAllRound('r16')" id="btn-sim-all-r16" data-t="btn_sim_all"></button>
          <div class="progress-wrap"><div class="progress-fill" id="progress-fill-r16" style="width:0%"></div></div>
        </div>
        <button class="btn-ghost" onclick="resimAllRound('r16')" data-t="btn_resim_all"></button>
        <button class="btn-icon-reset" onclick="askReset('r16')" title="Reset">🗑</button>
      </div>
    </div>
  </div>
  <div id="bracket-r16" class="bracket-grid"></div>
</div>

<div class="section" id="section-r8">
  <div class="section-title" data-t="r8_title"></div>
  <div class="section-sub" data-t="r8_sub"></div>
  <div class="action-bar">
    <div class="action-bar-left">
      <div class="action-bar-text" data-t="ko_action_desc"></div>
      <div class="action-btns">
        <div class="sim-primary-wrap">
          <button class="btn-primary" onclick="simAllRound('r8')" id="btn-sim-all-r8" data-t="btn_sim_all"></button>
          <div class="progress-wrap"><div class="progress-fill" id="progress-fill-r8" style="width:0%"></div></div>
        </div>
        <button class="btn-ghost" onclick="resimAllRound('r8')" data-t="btn_resim_all"></button>
        <button class="btn-icon-reset" onclick="askReset('r8')" title="Reset">🗑</button>
      </div>
    </div>
  </div>
  <div id="bracket-r8" class="bracket-grid"></div>
</div>

<div class="section" id="section-r4">
  <div class="section-title" data-t="r4_title"></div>
  <div class="section-sub" data-t="r4_sub"></div>
  <div class="action-bar">
    <div class="action-bar-left">
      <div class="action-bar-text" data-t="ko_action_desc"></div>
      <div class="action-btns">
        <div class="sim-primary-wrap">
          <button class="btn-primary" onclick="simAllRound('r4')" id="btn-sim-all-r4" data-t="btn_sim_all"></button>
          <div class="progress-wrap"><div class="progress-fill" id="progress-fill-r4" style="width:0%"></div></div>
        </div>
        <button class="btn-ghost" onclick="resimAllRound('r4')" data-t="btn_resim_all"></button>
        <button class="btn-icon-reset" onclick="askReset('r4')" title="Reset">🗑</button>
      </div>
    </div>

  document.documentElement.lang = currentLang;

  if(l1) l1.textContent=t('logo_line1');

  requestAnimationFrame(()=>{
    if(!l1||!l2) return;
    // Step 1: reset any previous adjustments
    l1.style.letterSpacing=''; l2.style.letterSpacing='';
    // Step 2: MUNDIAL (ES) is shorter than WORLD CUP (EN) naturally.
    // We want both languages to produce the SAME pixel width for line2.
    // Measure natural width of both language strings at current font settings.
    // Since we're already in one language, we use a hidden span to measure the other.
    const probe=document.createElement('span');
    probe.style.cssText='position:absolute;visibility:hidden;font-family:"Bebas Neue",sans-serif;font-size:16px;letter-spacing:4.5px;white-space:nowrap;';
    probe.textContent='WORLD CUP'; // always the wider string

    document.body.removeChild(probe);

    const w2=l2.offsetWidth;

      l1.style.letterSpacing=Math.max(0,3+extra2)+'px';

function getComment(hg,ag){
  const isEs=currentLang==='es';
  if(hg===ag) return (isEs?COMMENTS_DRAW_ES:COMMENTS_DRAW_EN)[Math.floor(Math.random()*(isEs?COMMENTS_DRAW_ES:COMMENTS_DRAW_EN).length)];
  const arr=isEs?COMMENTS_WIN_ES:COMMENTS_WIN_EN;
  return arr[Math.floor(Math.random()*arr.length)];
}

function getRating(name){const r=FIFA_RANK[name]||40;return Math.round(95-(r-1)*(50/47));}
function calcProbs(hR,aR){
  const diff=(hR+4)-aR;
  const pH=Math.min(72,Math.max(12,40+diff*0.55));
  const pA=Math.min(65,Math.max(8,32-diff*0.45));
  const pD=Math.max(8,100-pH-pA);
  const tot=pH+pD+pA;
  const ph=Math.round(pH/tot*100),pa=Math.round(pA/tot*100);
  return{ph,pd:100-ph-pa,pa};
}
// Poisson-like goal generator — realistic World Cup distribution
// avg goals per team ~1.15, very rare >3
function randGoals(lambda){
  // Inverse CDF approximation for Poisson
  const r=Math.random();
  const probs=[
    Math.exp(-lambda),                          // 0 goals
    lambda*Math.exp(-lambda),                   // 1 goal
    lambda*lambda/2*Math.exp(-lambda),          // 2 goals
    lambda*lambda*lambda/6*Math.exp(-lambda),   // 3 goals
    Math.pow(lambda,4)/24*Math.exp(-lambda),    // 4 goals
  ];
  let cum=0;
  for(let g=0;g<probs.length;g++){cum+=probs[g];if(r<cum)return g;}
  return 4; // max cap
}
function simScore(hR,aR,knockout=false){
  const{ph,pd,pa}=calcProbs(hR,aR);
  const rand=Math.random()*100;
  let outcome=rand<ph?'home':rand<ph+pd?'draw':'away';
  // Lambda (avg goals) scales with team quality: 0.7–1.6
  const hLambda=0.7+(hR/95)*0.9;
  const aLambda=0.6+(aR/95)*0.8;
  let hg=randGoals(hLambda), ag=randGoals(aLambda);
  // Force outcome
  if(outcome==='home'&&hg<=ag){hg=ag+1;}
  if(outcome==='away'&&ag<=hg){ag=hg+1;}
  if(outcome==='draw'){const g=Math.min(hg,ag);hg=g;ag=g;}
  if(knockout&&hg===ag)hg++; // no draw in KO
  return{hg,ag,ph,pd,pa};
}
async function runSim(homeN,awayN,knockout=false){
  const hR=getRating(homeN),aR=getRating(awayN);
  const{hg,ag,ph,pd,pa}=simScore(hR,aR,knockout);
  await sleep(20+Math.random()*15);
  return{home_goals:hg,away_goals:ag,prob_home:ph,prob_draw:pd,prob_away:pa,comment:getComment(hg,ag)};
}

// Snapshot top-3 names for a group
function getGroupTop3snap(gk){
  const s=[...groupStandings[gk]].sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
  return [s[0]?.team.n||'', s[1]?.team.n||'', s[2]?.team.n||''];
}

// When a group's classification changes, find and reset only the r16 slots
// that were using the old teams, then cascade resets through later rounds
function invalidateAffectedMatches(gk, before3, after3){
  const changedNames=new Set();
  before3.forEach((n,i)=>{ if(n!==after3[i]) changedNames.add(n); });
  after3.forEach((n,i)=>{ if(n!==before3[i]) changedNames.add(n); });
  if(changedNames.size===0) return;

  // Find which r16 matches involve any of the changed team names
  const affectedR16=new Set();
  rounds.r16.forEach((m,i)=>{
    if(changedNames.has(m.home?.n)||changedNames.has(m.away?.n)) affectedR16.add(i);
  });

  // Reset affected r16 matches and cascade forward
  affectedR16.forEach(i=>{
    const m=rounds.r16[i];
    const oldWinner=m.winner;
    m.hg=null; m.ag=null; m.winner=null; m.comment=null; m.ph=null; m.pa=null;
    // If this match had a winner, cascade that winner's presence forward
    if(oldWinner) invalidateCascade('r16', i, oldWinner);
  });
}

// Cascade: given a match index in a round whose winner changed, reset downstream matches
function invalidateCascade(rk, idx, oldWinner){
  const nextRk={r16:'r8',r8:'r4',r4:'r2',r2:'r1'}[rk];
  if(!nextRk) return;
  const ni=Math.floor(idx/2);
  const nm=rounds[nextRk][ni];
  if(!nm) return;
  const wasHome=nm.home?.n===oldWinner.n;
  const wasAway=nm.away?.n===oldWinner.n;
  if(!wasHome&&!wasAway) return;
  // Clear that slot
  if(wasHome) nm.home=null;
  if(wasAway) nm.away=null;
  const prevWinner=nm.winner;
  nm.hg=null; nm.ag=null; nm.winner=null; nm.comment=null; nm.ph=null; nm.pa=null;
  if(prevWinner) invalidateCascade(nextRk, ni, prevWinner);
}

// ============================================================
//  SIM GROUP MATCH
// ============================================================
async function simGroupMatch(gk,mi,silent=false){
  const g=GROUPS[gk],m=g.matches[mi];
  const home=g.teams[m.h],away=g.teams[m.a],key=`${gk}-${mi}`;
  const btn=document.getElementById(`bs-${key}`);
  if(btn){btn.disabled=true;btn.innerHTML=`<span class="spinner-sm"></span> ${t('simming')}`;}
  try{
    const r=await runSim(home.n,away.n,false);
    groupResults[key]={hg:r.home_goals,ag:r.away_goals,ph:r.prob_home,pd:r.prob_draw,pa:r.prob_away,comment:r.comment};
    const hEl=document.getElementById(`sd-${key}-h`),aEl=document.getElementById(`sd-${key}-a`);
    if(hEl)hEl.textContent=r.home_goals; if(aEl)aEl.textContent=r.away_goals;
    const ri=document.getElementById(`ri-${key}`);
    if(ri){ri.innerHTML=buildResultHtml(groupResults[key],home.n,away.n);ri.classList.add('show');}
    // Snapshot top-3 before updating standings
    const before3=getGroupTop3snap(gk);
    updateStandings(gk);
    const after3=getGroupTop3snap(gk);
    // Invalidate only affected knockout matches
    if(JSON.stringify(before3)!==JSON.stringify(after3)){
      invalidateAffectedMatches(gk, before3, after3);
    }
    // Always repopulate r16 with current standings if groups complete
    if(groupsDone()){ populateR16(); updateRoundButtonState('r16'); }
    if(btn){btn.disabled=false;btn.innerHTML=t('resim_btn');btn.className='btn-sim done';}
  }catch(e){
    if(btn){btn.disabled=false;btn.innerHTML=t('sim_btn');}
    if(!silent)showToast('Error');
    throw e;
  }
}

async function simGroupAll(gk){
  for(let mi=0;mi<GROUPS[gk].matches.length;mi++){
    if(!groupResults[`${gk}-${mi}`]) await simGroupMatch(gk,mi,true);
  }
}
async function resimGroupAll(gk){
  askConfirm(t('confirm_resim_title'),t('confirm_resim_msg'),async()=>{
    for(let mi=0;mi<GROUPS[gk].matches.length;mi++){
      await simGroupMatch(gk,mi,true);
    }
    showToast(t('toast_round_done'));
  });
}
function resetGroup(gk){
  askConfirm(t('confirm_reset_title'),t('confirm_reset_msg'),()=>{
    GROUPS[gk].matches.forEach((_,mi)=>delete groupResults[`${gk}-${mi}`]);
    resetRoundsFrom('r16');
    buildGroupsUI();
    showToast(t('toast_reset'));
  });
}

// ============================================================
//  UPDATE STANDINGS
// ============================================================
function updateStandings(gk){
  const g=GROUPS[gk],s=groupStandings[gk];
  if(!s)return;
  // Reset stats
  s.forEach(r=>{r.pts=0;r.gf=0;r.ga=0;r.gd=0;r.mp=0;});
  // Accumulate
  g.matches.forEach((m,mi)=>{
    const r=groupResults[`${gk}-${mi}`]; if(!r)return;
    const h=s.find(x=>x.idx===m.h),a=s.find(x=>x.idx===m.a);
    h.mp++;a.mp++;h.gf+=r.hg;h.ga+=r.ag;a.gf+=r.ag;a.ga+=r.hg;
    h.gd=h.gf-h.ga;a.gd=a.gf-a.ga;
    if(r.hg>r.ag)h.pts+=3; else if(r.hg<r.ag)a.pts+=3; else{h.pts+=1;a.pts+=1;}
  });
  // Sort
  s.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
  // Check if group is fully simulated
  const allPlayed=GROUPS[gk].matches.every((_,mi)=>!!groupResults[`${gk}-${mi}`]);
  // Rebuild standings container in sorted order
  const container=document.getElementById(`gs-${gk}`); if(!container)return;
  const hdr=`<div class="standings-row hdr"><div></div><div></div><div style="text-align:center">PJ</div><div style="text-align:center">GD</div><div class="pts">Pts</div></div>`;
  const rows=s.map((row,rank)=>{
    const q=allPlayed&&rank<2;
    return `<div class="standings-row${q?' qualified':''}">
      <div class="pos">${rank+1}</div>
      <div class="flag-name"><div class="${q?'qbar':'ebar'}"></div>
        <span class="s-flag">${row.team.f}</span><span class="s-name">${row.team.n}</span>
      </div>
      <div style="text-align:center">${row.mp}</div>
      <div style="text-align:center">${row.gd>0?'+':''}${row.gd}</div>
      <div class="pts">${row.pts}</div>
    </div>`;
  }).join('');
  container.innerHTML=hdr+rows;
}

async function simAllGroups(){
  const btn=document.getElementById('btn-sim-all-groups');
  btn.disabled=true;
  const allMatches=[];
  Object.keys(GROUPS).forEach(gk=>GROUPS[gk].matches.forEach((_,mi)=>{
    if(!groupResults[`${gk}-${mi}`])allMatches.push({gk,mi});
  }));
  const total=allMatches.length,fill=document.getElementById('progress-fill-grupos');
  let done=0;
  for(const{gk,mi}of allMatches){
    try{await simGroupMatch(gk,mi,true);}catch(e){break;}
    done++;if(fill)fill.style.width=(done/total*100)+'%';
    await sleep(8);
  }
  btn.disabled=false;
  showToast(t('toast_groups_done'));
  populateR16();
}

// ============================================================
//  POPULATE R16
// ============================================================
function groupsDone(){
  return Object.keys(GROUPS).every(gk=>GROUPS[gk].matches.every((_,mi)=>!!groupResults[`${gk}-${mi}`]));
}
function getTop3(){
  const res={};
  Object.keys(GROUPS).forEach(gk=>{
    const s=[...groupStandings[gk]].sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
    res[gk]={first:s[0]?s[0].team:GROUPS[gk].teams[0],second:s[1]?s[1].team:GROUPS[gk].teams[1],third:s[2]?s[2].team:GROUPS[gk].teams[2]};
  });
  return res;
}
function populateR16(){
  if(!groupsDone())return;
  const top=getTop3();

  // FIFA Mundial 2026 — emparejamientos oficiales de 16vos de final
  // Los 8 mejores terceros se distribuyen en partidos específicos según grupos
  // Orden oficial según calendario FIFA publicado
  const pairs=[
    // Partidos 1-8: primeros vs segundos de grupos cruzados
    [top['A'].first,  top['B'].second],  // P1
    [top['C'].first,  top['D'].second],  // P2
    [top['E'].first,  top['F'].second],  // P3
    [top['G'].first,  top['H'].second],  // P4
    [top['I'].first,  top['J'].second],  // P5
    [top['K'].first,  top['L'].second],  // P6
    [top['B'].first,  top['A'].second],  // P7
    [top['D'].first,  top['C'].second],  // P8
    [top['F'].first,  top['E'].second],  // P9
    [top['H'].first,  top['G'].second],  // P10
    [top['J'].first,  top['I'].second],  // P11
    [top['L'].first,  top['K'].second],  // P12
    // Partidos 13-16: 4 mejores terceros (seleccionamos los de grupos más competitivos)
    [top['A'].third,  top['F'].third],   // P13
    [top['B'].third,  top['E'].third],   // P14
    [top['C'].third,  top['H'].third],   // P15
    [top['D'].third,  top['G'].third],   // P16
  ];

  // Update each slot: preserve result if teams are identical, else clear
  pairs.forEach((pair,i)=>{
    const m=rounds.r16[i];
    const sameHome=m.home?.n===pair[0]?.n;
    const sameAway=m.away?.n===pair[1]?.n;
    if(sameHome&&sameAway) return; // teams unchanged → keep result
    // Teams changed → update and clear result
    m.home=pair[0]; m.away=pair[1];
    m.hg=null; m.ag=null; m.winner=null; m.comment=null; m.ph=null; m.pa=null;
  });
}

// Propagación del bracket: los ganadores de r16 se cruzan así en octavos
// P1 vs P2 → partido 1 de octavos, P3 vs P4 → partido 2, etc.
// renderBracket ya maneja esto con Math.floor(i/2)

// Update the "Simulate All" button for a round to show pending state
function updateRoundButtonState(rk){
  const btn=document.getElementById(`btn-sim-all-${rk}`);
  if(!btn) return;
  const matches=rounds[rk];
  const hasPending=matches.some(m=>m.home&&m.away&&!m.winner);
  const hasDone=matches.some(m=>m.winner);
  // Orange "continue" only when MIXED: some done AND some pending (changed state)
  if(hasPending&&hasDone){
    btn.classList.add('has-pending');
    btn.innerHTML='⚠ '+t('btn_continue');
  } else {
    btn.classList.remove('has-pending');
    btn.setAttribute('data-t','btn_sim_all');
    btn.innerHTML=t('btn_sim_all');
  }
}
function prevRoundKey(rk){return{r16:null,r8:'r16',r4:'r8',r2:'r4',r1:'r2'}[rk];}

function buildKOResultHtml(match){
  if(match.hg===null||!match.home||!match.away) return '';
  const homeN=match.home.n, awayN=match.away.n;
  const winner=match.hg>match.ag?homeN:awayN;
  const winnerLbl=currentLang==='es'?`✓ ${winner} gana`:`✓ ${winner} wins`;
  return `<div class="bm-result show">
    <div class="bm-result-winner">${winnerLbl}</div>
    <div class="bm-result-comment">${match.comment||''}</div>
    <div class="bm-result-probs">
      <div class="bm-prob-wrap">
        <div class="bm-prob-label">${homeN}</div>
        <div class="bm-prob-bar"><div class="bm-prob-fill h" style="width:${match.ph||0}%"></div></div>
        <div class="bm-prob-pct">${match.ph||0}%</div>
      </div>
      <div class="bm-prob-wrap">
        <div class="bm-prob-label">${awayN}</div>
        <div class="bm-prob-bar"><div class="bm-prob-fill a" style="width:${match.pa||0}%"></div></div>
        <div class="bm-prob-pct">${match.pa||0}%</div>
      </div>
    </div>
  </div>`;
}

function renderBracket(rk){
  const container=document.getElementById(`bracket-${rk}`); if(!container)return;

  // For r16: if groups not done, show pending
  if(rk==='r16'&&!groupsDone()){
    container.innerHTML=pendingHtml(t('pending_title'),t('pending_desc'),'grupos',t('go_groups'));
    return;
  }

  // Always populate teams from previous round winners
  const prev=prevRoundKey(rk);
  if(prev){
    rounds[prev].forEach((m,i)=>{
      if(!m.winner) return;
      const ni=Math.floor(i/2), slot=i%2===0?'home':'away';
      if(!rounds[rk][ni].winner) rounds[rk][ni][slot]=m.winner;
    });
  }

  // For r8+: if previous round has no winners at all, show pending pointing to first incomplete
  if(prev&&rounds[prev].every(m=>!m.winner)){
    const target=firstPendingRound(rk);
    const lbl=target==='grupos'?t('go_groups'):t('go_prev');
    container.innerHTML=pendingHtml(t('pending_title'),t('pending_desc'),target,lbl);
    return;
  }

  const matches=rounds[rk];
  const simLbl=currentLang==='es'?'Simular':'Simulate';
  const resimLbl=currentLang==='es'?'Resimular':'Re-simulate';
  let html='<div class="bracket-grid">';
  matches.forEach((match,i)=>{
    const home=match.home, away=match.away;
    const played=match.hg!==null;
    const ready=home&&away;
    const hC=played?(match.hg>match.ag?'winner':'loser'):'';
    const aC=played?(match.ag>match.hg?'winner':'loser'):'';
    const pend=(!home||!away)?'pending':'';

    html+=`<div class="bracket-match ${pend}" id="bm-${match.id}">
      <div class="bm-label">${currentLang==='es'?'Partido':'Match'} ${i+1}</div>
      <div class="bracket-team ${hC}">
        <span class="b-flag">${home?home.f:'❓'}</span>
        <span class="b-name ${!home?'b-tbd':''}">${home?home.n:(currentLang==='es'?'Por definir':'TBD')}</span>
        <span class="b-score">${played?match.hg:''}</span>
      </div>
      <div class="bracket-team ${aC}">
        <span class="b-flag">${away?away.f:'❓'}</span>
        <span class="b-name ${!away?'b-tbd':''}">${away?away.n:(currentLang==='es'?'Por definir':'TBD')}</span>
        <span class="b-score">${played?match.ag:''}</span>
      </div>
      ${played?buildKOResultHtml(match):''}
      ${ready?`<div class="bm-actions">
        <button class="bm-sim-btn${played?' resim':''}" id="bsb-${match.id}" onclick="simKO('${rk}',${i})">
          ${played?`↺ ${resimLbl}`:`▶ ${simLbl}`}
        </button>
      </div>`:''}
    </div>`;
  });
  html+='</div>';
  container.innerHTML=html;
  updateRoundButtonState(rk);

  if(rk==='r1'&&rounds.r1[0].winner){
    const w=rounds.r1[0].winner;
    const cd=document.getElementById('champion-display');
    cd.style.display='block';
    cd.innerHTML=`<span class="trophy-big">🏆</span><div class="champion-name">${w.f} ${w.n}</div><div class="champion-sub">${t('champion')}</div>`;
  } else if(rk==='r1'){
    document.getElementById('champion-display').style.display='none';
  }
}

function firstPendingRound(rk){
  // Walk back from rk to find the earliest round that's not complete
  const order=['r16','r8','r4','r2','r1'];
  const idx=order.indexOf(rk);
  // Check groups first if rk is r16
  if(rk==='r16') return 'grupos';
  // Walk backwards to find first incomplete round
  for(let i=0;i<idx;i++){
    const r=order[i];
    if(rounds[r].every(m=>!m.winner)) return r;
    if(rounds[r].some(m=>!m.winner)) return r;
  }
  return order[idx-1];
}

function pendingHtml(title,desc,targetRk,btnLabel){
  const sectionId = targetRk==='grupos' ? 'grupos' : targetRk;
  const tabIdx = {grupos:0,r16:1,r8:2,r4:3,r2:4,r1:5}[sectionId];
  const onclick=`showSection('${sectionId}',document.querySelectorAll('.nav-tab')[${tabIdx}])`;
  return `<div class="pending-msg">
    <div class="big">⏳</div>
    <h3>${title}</h3>
    <p>${desc}</p>
    <button class="btn-primary" onclick="${onclick}">${btnLabel}</button>
  </div>`;
}

// ============================================================
//  SIM KNOCKOUT
// ============================================================
async function simKO(rk,idx,silent=false){
  const match=rounds[rk][idx];
  if(!match.home||!match.away)return;
  const btn=document.getElementById(`bsb-${match.id}`);
  if(btn){btn.disabled=true;btn.innerHTML=`<span class="spinner-sm"></span> ${t('simming')}`;}
  try{
    const r=await runSim(match.home.n,match.away.n,true);
    match.hg=r.home_goals;match.ag=r.away_goals;
    match.ph=r.prob_home;match.pa=r.prob_away;
    match.comment=r.comment;
    if(match.hg===match.ag)match.hg++;
    match.winner=match.hg>match.ag?match.home:match.away;
    // Reset subsequent rounds when a match is re-simmed
    const nextRk={r16:'r8',r8:'r4',r4:'r2',r2:'r1'}[rk];
    if(nextRk) resetRoundsFrom(nextRk);
    renderBracket(rk);
  }catch(e){
    if(!silent)showToast('Error');
    if(btn){btn.disabled=false;btn.innerHTML=`▶ ${currentLang==='es'?'Simular':'Simulate'}`;}
    throw e;
  }
}

async function simAllRound(rk){
  if(rk==='r16'&&!groupsDone()){
    showToast(t('pending_title')+' — '+t('go_groups')); return;
  }
  const prev=prevRoundKey(rk);
  if(prev&&rounds[prev].every(m=>!m.winner)){
    showToast(t('pending_title')); return;
  }
  if(rk==='r16')populateR16();
  const btn=document.getElementById(`btn-sim-all-${rk}`);
  if(btn)btn.disabled=true;
  const fill=document.getElementById(`progress-fill-${rk}`);
  const total=rounds[rk].filter(m=>m.home&&m.away&&!m.winner).length;
  let done=0;
  if(fill)fill.style.width='0%';
  for(let i=0;i<rounds[rk].length;i++){
    const m=rounds[rk][i];
    if(m.home&&m.away&&!m.winner){
      try{await simKO(rk,i,true);}catch(e){break;}
      done++;
      if(fill)fill.style.width=(done/total*100)+'%';
      renderBracket(rk);await sleep(10);
    }
  }
  if(btn){btn.disabled=false;}
  updateRoundButtonState(rk);
  showToast(t('toast_round_done'));
}

async function resimAllRound(rk){
  if(rk==='r16'&&!groupsDone()){showToast(t('pending_title'));return;}
  const prev=prevRoundKey(rk);
  if(prev&&rounds[prev].every(m=>!m.winner)){showToast(t('pending_title'));return;}
  askConfirm(t('confirm_resim_title'),t('confirm_resim_msg'),async()=>{
    // Reset subsequent rounds
    const nextRk={r16:'r8',r8:'r4',r4:'r2',r2:'r1'}[rk];
    if(nextRk)resetRoundsFrom(nextRk);
    // Re-sim all matches in this round
    const btn=document.getElementById(`btn-sim-all-${rk}`);
    if(btn)btn.disabled=true;
    for(let i=0;i<rounds[rk].length;i++){
      const m=rounds[rk][i];
      if(m.home&&m.away){
        m.hg=null;m.ag=null;m.winner=null;
        try{await simKO(rk,i,true);}catch(e){break;}
        renderBracket(rk);await sleep(10);
      }
    }
    if(btn)btn.disabled=false;
    showToast(t('toast_round_done'));
  });
}

// ============================================================
//  UTILS
// ============================================================
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

// ============================================================
//  INIT
// ============================================================
window.addEventListener('load',()=>{
  detectLang();
  applyLang();
});
</script>
